<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鸞鳳玉身分證</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; text-align: left; }
        h1 { color: #2c3e50; font-size: 24px; }
        p { color: #555; line-height: 1.6; margin: 8px 0; }
        .highlight { color: #27ae60; font-weight: bold; }
        .timeline { margin-top: 20px; border-left: 2px solid #27ae60; padding-left: 15px; }
        .timeline-item { margin-bottom: 10px; position: relative; }
        .timeline-date { font-size: 12px; color: #888; }
        .timeline-event { font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <div class="card" id="plant-info">
        <h2>載入中...</h2>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        fetch('plants.json')
            .then(response => response.json())
            .then(data => {
                const plant = data.find(p => p.id === id);
                const container = document.getElementById('plant-info');
                
                if (plant) {
                    // 自動計算已照顧天數
                    const purchaseDate = new Date(plant.purchaseDate);
                    const today = new Date();
                    const diffTime = Math.abs(today - purchaseDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    // 動態產生時間軸的 HTML
                    let historyHtml = '';
                    if (plant.history && plant.history.length > 0) {
                        plant.history.forEach(h => {
                            historyHtml += `
                                <div class="timeline-item">
                                    <div class="timeline-date">📅 ${h.date}</div>
                                    <div class="timeline-event">${h.event}</div>
                                </div>
                            `;
                        });
                    } else {
                        historyHtml = '<p>尚無歷史紀錄</p>';
                    }

                    container.innerHTML = `
                        <h1>🌵 ${plant.name}</h1>
                        <p><strong>品種：</strong> ${plant.species}</p>
                        <p><strong>特徵：</strong> ${plant.features}</p>
                        <p><strong>盆寸：</strong> ${plant.potSize}</p>
                        <p><strong>入手日期：</strong> ${plant.purchaseDate}</p>
                        <p><strong>已照顧天數：</strong> <span class="highlight">${diffDays} 天</span></p>
                        <p><strong>換盆日：</strong> ${plant.repotDate}</p>
                        <p><strong>購買處：</strong> ${plant.purchaseFrom}</p>
                        <p><strong>備註：</strong> ${plant.notes}</p>
                        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                        <h3>🌱 生長紀錄時間軸</h3>
                        <div class="timeline">
                            ${historyHtml}
                        </div>
                    `;
                } else {
                    container.innerHTML = `<h2>找不到這顆植物的資料</h2><p>代號：${id}</p>`;
                }
            });
    </script>
</body>
</html>
